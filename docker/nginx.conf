server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: the default absolute redirect is built from $host (no port),
    # which sends the browser to port 80 instead of the published 4001.
    absolute_redirect off;

    # Preview only: force revalidation so edited CSS/JS is never served from a stale browser cache.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
